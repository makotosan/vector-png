name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    env:
      VECTOR_PNG_REQUIRE_NORMALIZATION: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cairo on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Cairo on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Cairo on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo
      - name: Configure Windows Cairo directory
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "VECTOR_PNG_CAIRO_DIR=$env:MSYS2_LOCATION\ucrt64\bin" >> $env:GITHUB_ENV
      - run: python -m pip install -e ".[test,normalize]" build
      - name: Install controlled SVG2 renderer
        run: python -m playwright install --with-deps chromium
      - name: Verify standalone skill matches package
        run: python -c "from pathlib import Path; names=['vector_png.py','vector_png_css.py','vector_png_normalize.py']; assert all(Path(n).read_bytes() == (Path('skills/vector-png/scripts') / n).read_bytes() for n in names)"
      - run: python -m pytest -q
      - run: python -m build
      - name: Standalone skill smoke test
        run: |
          python skills/vector-png/scripts/vector_png.py create examples/fireworks.svg skill-smoke.png --width 256 --height 256
          python skills/vector-png/scripts/vector_png.py inspect skill-smoke.png
          python skills/vector-png/scripts/roundtrip_check.py --output-dir skill-roundtrip
          python skills/vector-png/scripts/normalization_check.py --output-dir normalization-roundtrip
      - name: Install user skill on Windows and verify roundtrip
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install-vector-png.ps1 -CairoDirectory $env:VECTOR_PNG_CAIRO_DIR -WithNormalization

  specification-reference:
    name: Pinned specification fixture sanity (not implementation conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read and validate specification pin
        id: specification
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path('spec-reference.json').read_text(encoding='utf-8'))
          assert pin['repository'] == 'makotosan/vector-png-spec'
          assert re.fullmatch(r'[0-9a-f]{40}', pin['revision'])
          assert pin['normative_document'] == 'SPEC.md'
          assert pin['informative_translation'] == 'SPEC.ja.md'
          assert pin['optional_input_profile'] == 'profiles/svg-normalization-v1.md'
          assert pin['optional_input_profile_support'] == 'experimental-implemented'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('revision=' + pin['revision'] + '\n')
          PY
      - name: Checkout pinned specification
        uses: actions/checkout@v4
        with:
          repository: makotosan/vector-png-spec
          ref: ${{ steps.specification.outputs.revision }}
          path: .spec-reference
          persist-credentials: false
      - name: Install optional upstream structural-test dependency
        run: python -m pip install -r .spec-reference/requirements-normalization.txt
      - name: Check pinned fixture catalog (not CLI conformance)
        working-directory: .spec-reference
        run: |
          python -m unittest discover -s tests -v
          python tools/build_fixtures.py --check
          python tools/build_normalization_fixtures.py --check
      - name: Verify regression fixture provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          upstream = Path('.spec-reference/fixtures/normalization')
          for tests in [Path('tests'), Path('skills/vector-png/tests')]:
              for local, original in [('normalization-input.svg', 'nameplate.input.svg'),
                                      ('normalization-safe.svg', 'nameplate.expected.svg')]:
                  assert (tests / 'fixtures' / local).read_bytes() == (upstream / original).read_bytes()
              assert (tests / 'fixtures/normalization-cases.json').read_bytes() == (upstream / 'cases.json').read_bytes()
          PY
