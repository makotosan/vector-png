name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cairo on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Cairo on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cairo
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Cairo on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo
      - name: Configure Windows Cairo directory
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "VECTOR_PNG_CAIRO_DIR=$env:MSYS2_LOCATION\ucrt64\bin" >> $env:GITHUB_ENV
      - run: python -m pip install -e ".[test]" build
      - name: Verify standalone skill matches package
        run: python -c "from pathlib import Path; assert Path('vector_png.py').read_bytes() == Path('skills/vector-png/scripts/vector_png.py').read_bytes()"
      - run: python -m pytest -q
      - run: python -m build
      - name: Standalone skill smoke test
        run: |
          python skills/vector-png/scripts/vector_png.py create examples/fireworks.svg skill-smoke.png --width 256 --height 256
          python skills/vector-png/scripts/vector_png.py inspect skill-smoke.png
          python skills/vector-png/scripts/roundtrip_check.py --output-dir skill-roundtrip
      - name: Install user skill on Windows and verify roundtrip
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install-vector-png.ps1 -CairoDirectory $env:VECTOR_PNG_CAIRO_DIR

  specification-reference:
    name: Pinned specification fixture sanity (not implementation conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read and validate specification pin
        id: specification
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path('spec-reference.json').read_text(encoding='utf-8'))
          assert pin['repository'] == 'makotosan/vector-png-spec'
          assert re.fullmatch(r'[0-9a-f]{40}', pin['revision'])
          assert pin['normative_document'] == 'SPEC.md'
          assert pin['informative_translation'] == 'SPEC.ja.md'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('revision=' + pin['revision'] + '\n')
          PY
      - name: Checkout pinned specification
        uses: actions/checkout@v4
        with:
          repository: makotosan/vector-png-spec
          ref: ${{ steps.specification.outputs.revision }}
          path: .spec-reference
          persist-credentials: false
      - name: Check pinned fixture catalog (not CLI conformance)
        working-directory: .spec-reference
        run: |
          python -m unittest discover -s tests -v
          python tools/build_fixtures.py --check
